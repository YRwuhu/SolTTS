[package]
name = "sol_audio"
version = "0.1.0"
edition = "2021"
description = "Native realtime audio primitives for SolTTS (SPSC ring buffer, HPF, crossfade, PCM conversion)"
license = "MIT"

[lib]
name = "sol_audio"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
